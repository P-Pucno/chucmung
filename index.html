<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10</title>
  
  <!-- Các bộ font nghệ thuật tiếng Việt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,500;0,700;1,500&family=Caveat:wght@600;700&family=Comfortaa:wght@600;700&family=Dancing+Script:wght@600;700&family=Pacifico&family=Playfair+Display:ital,wght@0,600;1,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Quicksand', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
      position: relative;
      transition: background 0.8s ease;
    }

    /* ---------------- 1. BACKGROUND CHẾ ĐỘ MẶC ĐỊNH (NGÀY) ---------------- */
    body.mode-creator {
      background: radial-gradient(circle at center, #fff0f5 0%, #ffd8e4 55%, #febfd2 100%);
    }

    /* ---------------- 2. NEW BACKGROUND CHO LINK GỬI RIÊNG (ĐÊM HUYỀN ẢO) ---------------- */
    body.mode-recipient {
      background: radial-gradient(circle at 50% 20%, #2b1055 0%, #150630 50%, #080117 100%);
    }

    /* Đèn lồng & Tinh vân ánh trăng riêng cho chế độ nhận */
    body.mode-recipient .aurora-container {
      opacity: 0.85;
    }
    body.mode-recipient .blob-1 {
      background: #7928ca;
      width: 550px;
      height: 550px;
      top: -150px;
      left: 10%;
    }
    body.mode-recipient .blob-2 {
      background: #ff0080;
      width: 500px;
      height: 500px;
      bottom: -100px;
      right: 5%;
    }
    body.mode-recipient .blob-3 {
      background: #4338ca;
      width: 400px;
      height: 400px;
      bottom: 30%;
      left: -80px;
    }

    /* Đom đóm dạ quang lơ lửng ở background riêng */
    .firefly {
      position: fixed;
      width: 6px;
      height: 6px;
      background: #ffeb3b;
      border-radius: 50%;
      box-shadow: 0 0 12px 3px #ffeb3b, 0 0 20px 6px #ff4081;
      pointer-events: none;
      z-index: 2;
      animation: floatFirefly 8s infinite alternate ease-in-out;
    }
    @keyframes floatFirefly {
      0% { transform: translate(0, 0) scale(0.6); opacity: 0.2; }
      50% { opacity: 1; transform: translate(40px, -50px) scale(1.2); }
      100% { transform: translate(-30px, -120px) scale(0.8); opacity: 0.3; }
    }

    /* Cực quang Aurora */
    .aurora-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .aurora-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.6;
      animation: floatAurora 18s ease-in-out infinite alternate;
    }
    .blob-1 { width: 450px; height: 450px; background: #ff80ab; top: -100px; left: -100px; }
    .blob-2 { width: 500px; height: 500px; background: #ffd54f; bottom: -120px; right: -120px; animation-duration: 22s; }
    .blob-3 { width: 380px; height: 380px; background: #ff4081; bottom: 20%; left: 10%; animation-duration: 16s; }

    @keyframes floatAurora {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.15); }
    }

    /* Bụi kim tuyến */
    .sparkle-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      background-image: 
        radial-gradient(2px 2px at 15% 20%, #fff, transparent),
        radial-gradient(3px 3px at 85% 25%, #ffeb3b, transparent),
        radial-gradient(2.5px 2.5px at 20% 80%, #ffd54f, transparent),
        radial-gradient(3px 3px at 80% 85%, #fff, transparent),
        radial-gradient(2px 2px at 50% 15%, #ff80ab, transparent),
        radial-gradient(4px 4px at 50% 90%, #ffe082, transparent);
      background-size: 350px 350px;
      opacity: 0.75;
      animation: sparkleAnim 6s ease-in-out infinite alternate;
    }
    @keyframes sparkleAnim {
      0% { opacity: 0.45; transform: scale(0.98); }
      100% { opacity: 0.85; transform: scale(1.02); }
    }

    /* Viền hoa quanh 4 góc */
    .flower-frame {
      position: fixed;
      pointer-events: none;
      z-index: 2;
      opacity: 0.95;
      filter: drop-shadow(0 6px 14px rgba(233, 30, 99, 0.2));
      animation: swayFlower 6s ease-in-out infinite alternate;
    }
    @keyframes swayFlower {
      0% { transform: rotate(0deg) scale(1); }
      100% { transform: rotate(2deg) scale(1.03); }
    }
    .flower-tl { top: -20px; left: -20px; width: clamp(220px, 30vw, 380px); transform-origin: top left; }
    .flower-br { bottom: -20px; right: -20px; width: clamp(240px, 32vw, 400px); transform: rotate(180deg); transform-origin: bottom right; }
    .flower-tr { top: -15px; right: -15px; width: clamp(170px, 22vw, 280px); transform: scaleX(-1); }
    .flower-bl { bottom: -15px; left: -15px; width: clamp(170px, 22vw, 280px); transform: scaleY(-1); }

    /* Nút bật tắt nhạc */
    .music-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.85);
      border: 1.5px solid #ffccd5;
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      color: #e91e63;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 4px 12px rgba(233, 30, 99, 0.15);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s;
    }
    body.mode-recipient .music-btn {
      background: rgba(35, 15, 60, 0.85);
      color: #ff80ab;
      border-color: #7928ca;
    }

    /* Canvas pháo hoa */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 998;
    }

    /* ---------------- KHUNG CARD CHÍNH ---------------- */
    .card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      padding: 32px 24px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 
        0 18px 45px rgba(233, 30, 99, 0.16),
        0 0 0 1px rgba(255, 255, 255, 0.7) inset;
      border: 1.5px solid rgba(255, 204, 213, 0.8);
      position: relative;
      z-index: 10;
      backdrop-filter: blur(14px);
      transition: all 0.5s ease;
    }

    /* Style khung khi ở chế độ nhận riêng (Thiệp thư tay lãng mạn) */
    body.mode-recipient .card {
      background: rgba(25, 10, 45, 0.88);
      border: 1.5px solid rgba(255, 128, 171, 0.4);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 25px rgba(233, 30, 99, 0.3);
      color: #fff;
    }

    .badge {
      display: inline-block;
      background: #ffe3ea;
      color: #e91e63;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    body.mode-recipient .badge {
      background: rgba(233, 30, 99, 0.25);
      color: #ff80ab;
      border: 1px solid rgba(255, 128, 171, 0.4);
    }

    h1 {
      font-size: 25px;
      color: #ad1457;
      margin-bottom: 6px;
      font-weight: 700;
    }
    body.mode-recipient h1 {
      color: #ff80ab;
      text-shadow: 0 0 15px rgba(255, 64, 129, 0.5);
    }

    .sub-title {
      font-size: 13.5px;
      color: #666;
      margin-bottom: 18px;
    }
    body.mode-recipient .sub-title {
      color: #d1c4e9;
    }

    /* Ô nhập tên */
    .input-box {
      margin-bottom: 16px;
      text-align: left;
    }
    .input-box label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13.5px;
      font-weight: 700;
      color: #ad1457;
      margin-bottom: 6px;
      padding-left: 6px;
    }
    .recipient-input {
      width: 100%;
      padding: 10px 18px;
      font-size: 15px;
      border: 1.8px solid #f8bbd0;
      border-radius: 50px;
      outline: none;
      background: rgba(255, 250, 251, 0.95);
      color: #333;
      font-weight: 600;
      transition: all 0.25s;
    }

    /* Hộp quà */
    .gift-wrap {
      margin: 6px 0 14px 0;
    }
    .gift-icon {
      font-size: 64px;
      display: inline-block;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 8px 14px rgba(233, 30, 99, 0.25));
    }
    .shake {
      animation: shake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0) rotate(-4deg); }
      20%, 80% { transform: translate3d(3px, 0, 0) rotate(4deg); }
      30%, 50%, 70% { transform: translate3d(-5px, 0, 0) rotate(-6deg); }
      40%, 60% { transform: translate3d(5px, 0, 0) rotate(6deg); }
    }

    /* Khung hiển thị lời chúc */
    .message-box {
      background: rgba(255, 248, 249, 0.92);
      border: 1.5px dashed #f48fb1;
      border-radius: 18px;
      padding: 24px 20px;
      min-height: 145px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
      position: relative;
    }
    body.mode-recipient .message-box {
      background: rgba(45, 18, 75, 0.85);
      border: 1.5px dashed #ba68c8;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
    }

    .recipient-tag {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      color: #c2185b;
      background: #fce4ec;
      padding: 4px 16px;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    body.mode-recipient .recipient-tag {
      background: #7928ca;
      color: #fff;
      box-shadow: 0 0 10px rgba(121, 40, 202, 0.6);
    }
    
    .wish-text {
      color: #222;
      font-size: 18px;
      line-height: 1.65;
      transition: opacity 0.2s ease, transform 0.2s ease;
      font-family: 'Quicksand', sans-serif;
    }
    body.mode-recipient .wish-text {
      color: #fff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .bonus-gift {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 700;
      color: #d81b60;
      background: #fff;
      border: 1px solid #ffd1dc;
      padding: 4px 14px;
      border-radius: 20px;
      display: none;
    }
    body.mode-recipient .bonus-gift {
      background: rgba(255, 64, 129, 0.2);
      border-color: #ff4081;
      color: #ff80ab;
    }

    .font-badge {
      position: absolute;
      bottom: 6px;
      right: 12px;
      font-size: 10.5px;
      color: #b0bec5;
      font-weight: 600;
    }

    /* Các nút bấm */
    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-draw {
      background: linear-gradient(45deg, #ff4081, #e91e63);
      color: #fff;
      box-shadow: 0 5px 16px rgba(233, 30, 99, 0.35);
      flex: 1.3;
      justify-content: center;
    }
    .btn-copy {
      background: #fce4ec;
      color: #ad1457;
      border: 1px solid #f8bbd0;
      flex: 1;
      justify-content: center;
    }
    .btn-share {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
      width: 100%;
      justify-content: center;
      margin-top: 4px;
    }
    .btn-create-own {
      background: linear-gradient(45deg, #7928ca, #ff0080);
      color: #fff;
      width: 100%;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(255, 0, 128, 0.4);
      margin-top: 10px;
      display: none;
    }

    /* Toast */
    .toast {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12.5px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
      z-index: 100;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Cánh hoa rơi */
    .petal {
      position: fixed;
      top: -25px;
      pointer-events: none;
      user-select: none;
      z-index: 3;
      animation: fall linear forwards;
    }
    @keyframes fall {
      to { transform: translateY(105vh) translateX(80px) rotate(360deg); }
    }
  </style>
</head>
<body class="mode-creator">

  <!-- Vùng đom đóm dạ quang (dành cho background gửi riêng) -->
  <div id="firefliesContainer"></div>

  <!-- Cực quang mềm mại và bụi sao -->
  <div class="aurora-container">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
    <div class="aurora-blob blob-3"></div>
  </div>
  <div class="sparkle-bg"></div>

  <!-- Nút nhạc nền -->
  <button id="musicToggle" class="music-btn" onclick="toggleMusic()">
    <span id="musicIcon">🎵</span> <span id="musicText">Bật Nhạc</span>
  </button>

  <!-- SVG cụm hoa 4 góc màn hình -->
  <svg class="flower-frame flower-tl" viewBox="0 0 300 300" fill="none">
    <path d="M40 120 C10 80, 50 10, 100 30 C70 70, 80 110, 40 120 Z" fill="#81c784" opacity="0.85"/>
    <path d="M120 40 C80 10, 10 50, 30 100 C70 70, 110 80, 120 40 Z" fill="#66bb6a" opacity="0.9"/>
    <circle cx="85" cy="85" r="65" fill="#f48fb1" opacity="0.6"/>
    <circle cx="85" cy="85" r="50" fill="#f06292" opacity="0.8"/>
    <circle cx="85" cy="85" r="35" fill="#e91e63"/>
  </svg>

  <svg class="flower-frame flower-br" viewBox="0 0 300 300" fill="none">
    <path d="M40 120 C10 80, 50 10, 100 30 C70 70, 80 110, 40 120 Z" fill="#81c784" opacity="0.85"/>
    <path d="M120 40 C80 10, 10 50, 30 100 C70 70, 110 80, 120 40 Z" fill="#66bb6a" opacity="0.9"/>
    <circle cx="85" cy="85" r="70" fill="#f48fb1" opacity="0.6"/>
    <circle cx="85" cy="85" r="52" fill="#f06292" opacity="0.8"/>
    <circle cx="85" cy="85" r="36" fill="#e91e63"/>
  </svg>

  <canvas id="confettiCanvas"></canvas>

  <div class="card">
    <div id="toast" class="toast">✨ Đã sao chép!</div>
    <span id="cardBadge" class="badge">✦ 20/10 Yêu Thương ✦</span>
    <h1 id="cardTitle">Hộp Quà Lời Chúc</h1>
    <p id="cardSub" class="sub-title">Nhập tên của bạn để mở những điều bất ngờ ngọt ngào nhất!</p>

    <!-- Khu vực nhập tên (sẽ ẩn ở chế độ xem riêng) -->
    <div id="inputSection" class="input-box">
      <label for="recipientInput">
        Tên của bạn <span style="color:#e91e63;">&lt;3</span>
      </label>
      <input 
        type="text" 
        id="recipientInput" 
        class="recipient-input" 
        placeholder="Nhập tên đáng yêu của bạn vào đây..." 
        value="Bạn" 
        oninput="updateRecipient()" 
        autocomplete="off"
      />
    </div>

    <!-- Hộp quà -->
    <div class="gift-wrap">
      <span id="gift" class="gift-icon" onclick="drawWish()">🎁</span>
    </div>

    <!-- Khung hiển thị lời chúc -->
    <div class="message-box">
      <span id="recipientTag" class="recipient-tag">💌 Dành riêng cho: Bạn</span>
      <p id="wish" class="wish-text">Nhấn nút bên dưới để rút lời chúc ngẫu nhiên dành riêng cho bạn nhé!</p>
      <span id="bonusGift" class="bonus-gift"></span>
      <span id="fontBadge" class="font-badge"></span>
    </div>

    <!-- Nút bấm chế độ mặc định -->
    <div id="creatorActions" class="actions">
      <button type="button" class="btn btn-draw" onclick="drawWish()">🎲 Rút Quẻ Ngẫu Nhiên</button>
      <button type="button" class="btn btn-copy" onclick="copyWish()">📋 Sao Chép</button>
      <button type="button" class="btn btn-share" onclick="sharePersonalLink()">🔗 Tạo Link Gửi Cho Người Ấy</button>
    </div>

    <!-- Nút bấm chế độ xem link riêng -->
    <button id="createOwnBtn" class="btn btn-create-own" onclick="window.location.href = window.location.pathname">
      ✨ Tạo Thiệp 20/10 Cho Người Khác
    </button>
  </div>

  <script>
    const fontStyles = [
      { name: "Dancing Script", family: "'Dancing Script', cursive", size: "21px", weight: "700" },
      { name: "Pacifico", family: "'Pacifico', cursive", size: "17.5px", weight: "400" },
      { name: "Playfair Display", family: "'Playfair Display', serif", size: "17.5px", weight: "600", style: "italic" },
      { name: "Caveat", family: "'Caveat', cursive", size: "23px", weight: "700" },
      { name: "Comfortaa", family: "'Comfortaa', cursive", size: "16px", weight: "700" },
      { name: "Be Vietnam Pro", family: "'Be Vietnam Pro', sans-serif", size: "16px", weight: "600" }
    ];

    const bonusGifts = [
      "🎁 Món quà kèm: 1 ngày được cưng chiều vô điều kiện!",
      "☕ Món quà kèm: 1 ly trà sữa full topping ngọt ngào!",
      "💸 Món quà kèm: Tài khoản ting ting liên hồi cả tuần!",
      "✨ Món quà kèm: 100 điều may mắn đang trên đường tới!",
      "🍕 Món quà kèm: 1 bữa ăn ngon miệng thả ga không lo béo!",
      "🌸 Món quà kèm: Nhan sắc thăng hạng, vạn người mê đắm!"
    ];

    const wishList = [
      "Nhân ngày 20/10, chúc {name} luôn rạng rỡ như ánh ban mai, ngập tràn niềm vui và nhận được thật nhiều tình cảm ấm áp! 🌸",
      "Chúc {name} không chỉ riêng ngày 20/10 mà cả 365 ngày trong năm đều được yêu thương, chở che và bình an trong từng khoảnh khắc.",
      "Gửi tới {name} ngàn đóa hồng và những lời chúc tốt đẹp nhất: Mong {name} luôn được nâng niu, trân trọng mỗi ngày! 💐",
      "Chúc {name} một đời bình an, sớm ngắm hoa nở, chiều đón hoàng hôn, bên cạnh luôn có người thấu hiểu và cưng chiều. 🌷",
      "Thế giới này nhờ có sự dịu dàng của {name} mà trở nên ấm áp hơn rất nhiều. Chúc mừng ngày Phụ nữ Việt Nam 20/10! ✨",
      "Mong cho những mong ước nhỏ bé của {name} đều trở thành hiện thực, mỗi ngày thức dậy đều là một ngày ngập tràn niềm vui! 💖",
      "Chúc {name} luôn giữ được ánh mắt long lanh và nụ cười ngọt ngào như những ngày đầu tiên. Bạn xứng đáng với tất cả sự nâng niu trên đời! 🎀",
      "Chúc {name} một ngày 20/10 trọn vẹn: Tiền vào ào ào, việc nhẹ lương cao, ăn hoài không béo và lúc nào cũng xinh đẹp! 🥳",
      "Chúc {name} hôm nay: Quà ngập nhà, hoa ngập phòng, điện thoại ting ting tiền về liên tục và người yêu ngoan như cún! 💸",
      "Nhiệm vụ duy nhất của {name} hôm nay là nghỉ ngơi, thật xinh đẹp và đón nhận những điều ngọt ngào nhất. Việc khó cứ để vũ trụ lo! 👑",
      "Chúc {name} da trắng dáng xinh, ăn uống thả ga không lo mỡ bụng, ví luôn rủng rỉnh và shopping không cần nhìn giá! 🛍️",
      "20/10 chúc {name} nhận được nhiều hoa, nhiều quà, và đặc biệt là nhận được sự yêu thương vô điều kiện từ người ấy nhé! 🎁",
      "Chúc {name} luôn tự tin vào bản thân, gặt hái thêm nhiều thành công rực rỡ và luôn là phiên bản tỏa sáng rực rỡ nhất của chính mình! ⭐",
      "Hãy luôn kiêu hãnh như một đóa hồng, xinh đẹp độc lập và mạnh mẽ bước đi trên con đường {name} đã chọn. Chúc mừng 20/10! 🌹",
      "20 tháng 10 rộn ràng,\nChúc cho {name} mãi dịu dàng đoan trang,\nTiền vô như nước đò ngang,\nHạnh phúc ngập tràn rạng rỡ như hoa! 📜🌸",
      "Hoa hồng có gai nhưng em thì không,\nChúc {name} má đỏ môi hồng,\nĐường tình như ý, đường tiền mênh mông! ✨💖",
      "20/10 chúc {name} cười tươi như hoa nở mùa xuân, mắt biếc long lanh, ví dày cộm và bão giông cuộc đời dừng sau cánh cửa! 🍀",
      "Chúc {name} luôn tràn đầy năng lượng tích cực, công việc thuận buồm xuôi gió, tình duyên như ý và vạn sự hanh thông! 💼",
      "Cảm ơn vì {name} đã xuất hiện và mang đến nguồn năng lượng tươi sáng cho những người xung quanh. Chúc bạn có một ngày 20/10 thật trọn vẹn! 💌",
      "Chúc {name} một đời được yêu thương đúng cách, không phải gồng mình mạnh mẽ, luôn được dịu dàng ôm ấp sau những ngày mỏi mệt! 🕊️"
    ];

    let currentWishIdx = 0;
    let currentFontIdx = 0;

    function getName() {
      const input = document.getElementById('recipientInput');
      return (input && input.value.trim() !== "") ? input.value.trim() : "Bạn";
    }

    function formatText(template, name) {
      return template.split("{name}").join(name);
    }

    function applyFont(fIndex) {
      const wishElem = document.getElementById('wish');
      const fontBadge = document.getElementById('fontBadge');
      const font = fontStyles[fIndex % fontStyles.length];

      wishElem.style.fontFamily = font.family;
      wishElem.style.fontSize = font.size;
      wishElem.style.fontWeight = font.weight;
      wishElem.style.fontStyle = font.style || "normal";
      if (fontBadge) fontBadge.innerText = font.name;
    }

    function updateRecipient() {
      const name = getName();
      document.getElementById('recipientTag').innerText = "💌 Dành riêng cho: " + name;
      const wishElem = document.getElementById('wish');
      if (wishList[currentWishIdx]) {
        wishElem.innerText = formatText(wishList[currentWishIdx], name);
      }
    }

    /* Rút ngẫu nhiên */
    function drawWish() {
      const gift = document.getElementById('gift');
      const wishElem = document.getElementById('wish');
      const bonusElem = document.getElementById('bonusGift');

      gift.classList.remove('shake');
      void gift.offsetWidth;
      gift.classList.add('shake');

      wishElem.style.opacity = '0';

      setTimeout(() => {
        currentWishIdx = Math.floor(Math.random() * wishList.length);
        currentFontIdx = Math.floor(Math.random() * fontStyles.length);

        const name = getName();
        wishElem.innerText = formatText(wishList[currentWishIdx], name);
        document.getElementById('recipientTag').innerText = "💌 Dành riêng cho: " + name;
        
        const randomBonus = bonusGifts[Math.floor(Math.random() * bonusGifts.length)];
        bonusElem.innerText = randomBonus;
        bonusElem.style.display = "inline-block";

        applyFont(currentFontIdx);

        wishElem.style.opacity = '1';
        fireConfetti();
      }, 180);
    }

    /* TẠO LINK GỬI RIÊNG KÈM LỜI CHÚC CỐ ĐỊNH VÀ BACKGROUND MỚI */
    function sharePersonalLink() {
      const name = encodeURIComponent(getName());
      const shareUrl = window.location.origin + window.location.pathname + 
                       "?to=" + name + 
                       "&w=" + currentWishIdx + 
                       "&f=" + currentFontIdx;
      
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          showToast("🔗 Đã chép link riêng cho " + getName() + "!");
        });
      }
    }

    function copyWish() {
      const text = document.getElementById('wish').innerText;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast("✨ Đã sao chép lời chúc!"));
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    /* Kiểm tra khi người nhận mở link */
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const recipient = params.get('to');
      const wishId = params.get('w');
      const fontId = params.get('f');

      // NẾU CÓ THAM SỐ GỬI RIÊNG -> CHUYỂN SANG NEW BACKGROUND & GIAO DIỆN RIÊNG
      if (recipient) {
        document.body.className = "mode-recipient";
        
        // Ẩn thanh nhập tên và nút rút quẻ
        document.getElementById('inputSection').style.display = "none";
        document.getElementById('creatorActions').style.display = "none";
        document.getElementById('createOwnBtn').style.display = "inline-flex";

        // Cập nhật tiêu đề thiệp trao tay
        const name = decodeURIComponent(recipient);
        document.getElementById('cardBadge').innerText = "✦ THIỆP GỬI RIÊNG BẠN ✦";
        document.getElementById('cardTitle').innerText = "Món Quà Dành Cho " + name;
        document.getElementById('cardSub').innerText = "Bức thư này được gửi gắm riêng với tất cả sự trân trọng và ngọt ngào nhất!";
        document.getElementById('recipientTag').innerText = "💌 Gửi tặng: " + name;

        // Lấy đúng lời chúc đã chọn riêng
        const wIdx = (wishId !== null && !isNaN(wishId)) ? parseInt(wishId) : 0;
        const fIdx = (fontId !== null && !isNaN(fontId)) ? parseInt(fontId) : 0;
        
        currentWishIdx = wIdx;
        const wishElem = document.getElementById('wish');
        wishElem.innerText = formatText(wishList[wIdx], name);
        applyFont(fIdx);

        // Hiển thị phần quà may mắn
        const bonusElem = document.getElementById('bonusGift');
        bonusElem.innerText = bonusGifts[wIdx % bonusGifts.length];
        bonusElem.style.display = "inline-block";

        // Tạo đom đóm bay ở background đêm
        createFireflies();

        // Tự động bung pháo hoa chúc mừng
        setTimeout(fireConfetti, 600);
      } else {
        // Chế độ ban đầu
        drawWish();
      }
    });

    // Tạo đom đóm cho background riêng
    function createFireflies() {
      const container = document.getElementById('firefliesContainer');
      for (let i = 0; i < 20; i++) {
        const firefly = document.createElement('div');
        firefly.className = 'firefly';
        firefly.style.left = Math.random() * 100 + 'vw';
        firefly.style.top = Math.random() * 100 + 'vh';
        firefly.style.animationDelay = (Math.random() * 5) + 's';
        firefly.style.animationDuration = (Math.random() * 6 + 6) + 's';
        container.appendChild(firefly);
      }
    }

    /* Hiệu ứng pháo hoa */
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function fireConfetti() {
      const colors = ['#ff4081', '#ff80ab', '#f50057', '#ffd54f', '#ff1744', '#b388ff', '#ffeb3b'];
      for (let i = 0; i < 75; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height * 0.55,
          vx: (Math.random() - 0.5) * 15,
          vy: (Math.random() - 0.85) * 16,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          rot: Math.random() * 360
        });
      }
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.35;
        p.alpha -= 0.012;
        p.rot += 4;

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();

        if (p.alpha <= 0 || p.y > canvas.height) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(animateConfetti);
    }
    animateConfetti();

    /* Mưa cánh hoa */
    function createPetal() {
      const petal = document.createElement('div');
      petal.className = 'petal';
      petal.innerText = ['🌸', '✨', '💐', '🌷', '💖', '❤️'][Math.floor(Math.random() * 6)];
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.fontSize = (Math.random() * 8 + 14) + 'px';
      petal.style.animationDuration = (Math.random() * 4 + 5) + 's';
      petal.style.opacity = Math.random() * 0.7 + 0.3;
      document.body.appendChild(petal);
      setTimeout(() => petal.remove(), 8000);
    }
    setInterval(createPetal, 450);

    /* Nhạc nền */
    let audioCtx = null, isPlaying = false, timerId = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    const melody = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 293.66, 349.23, 440.00, 587.33, 440.00, 349.23];
    let noteIdx = 0;
    function playNote() {
      if (!isPlaying || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(melody[noteIdx], audioCtx.currentTime);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.85);
      noteIdx = (noteIdx + 1) % melody.length;
      timerId = setTimeout(playNote, 400);
    }
    function toggleMusic() {
      initAudio();
      const icon = document.getElementById('musicIcon');
      const text = document.getElementById('musicText');
      if (!isPlaying) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        isPlaying = true;
        icon.innerText = '🔊';
        text.innerText = 'Dừng Nhạc';
        playNote();
      } else {
        isPlaying = false;
        clearTimeout(timerId);
        icon.innerText = '🎵';
        text.innerText = 'Bật Nhạc';
      }
    }
  </script>
</body>
</html>
