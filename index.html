<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Quicksand', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Nền hồng phấn mềm mại */
      background: radial-gradient(circle at center, #fff1f5 0%, #ffdbe4 60%, #fec8d8 100%);
      padding: 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Khung trang trí hình hoa quanh 4 góc */
    .flower-frame {
      position: fixed;
      pointer-events: none;
      z-index: 2;
      opacity: 0.92;
      filter: drop-shadow(0 6px 14px rgba(233, 30, 99, 0.18));
      transition: transform 0.3s ease;
    }

    /* Cụm hoa góc trên bên trái */
    .flower-tl {
      top: -20px;
      left: -20px;
      width: clamp(220px, 30vw, 380px);
    }

    /* Cụm hoa góc dưới bên phải */
    .flower-br {
      bottom: -20px;
      right: -20px;
      width: clamp(240px, 32vw, 400px);
      transform: rotate(180deg);
    }

    /* Cụm hoa góc trên bên phải */
    .flower-tr {
      top: -15px;
      right: -15px;
      width: clamp(170px, 22vw, 280px);
      transform: scaleX(-1);
    }

    /* Cụm hoa góc dưới bên trái */
    .flower-bl {
      bottom: -15px;
      left: -15px;
      width: clamp(170px, 22vw, 280px);
      transform: scaleY(-1);
    }

    /* Dải hạt lấp lánh ánh kim */
    .sparkle-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      background-image: 
        radial-gradient(2px 2px at 15% 20%, #fff, transparent),
        radial-gradient(3px 3px at 85% 25%, #ffeb3b, transparent),
        radial-gradient(2.5px 2.5px at 20% 80%, #ffd54f, transparent),
        radial-gradient(3px 3px at 80% 85%, #fff, transparent),
        radial-gradient(2px 2px at 50% 15%, #ff80ab, transparent),
        radial-gradient(4px 4px at 50% 90%, #ffe082, transparent);
      background-size: 350px 350px;
      opacity: 0.75;
      animation: sparkleAnim 6s ease-in-out infinite alternate;
    }

    @keyframes sparkleAnim {
      0% { opacity: 0.45; transform: scale(0.98); }
      100% { opacity: 0.85; transform: scale(1.02); }
    }

    /* Cánh hoa & icon rơi tự do */
    .petal {
      position: fixed;
      top: -25px;
      pointer-events: none;
      user-select: none;
      z-index: 3;
      animation: fall linear forwards;
    }
    @keyframes fall {
      to {
        transform: translateY(105vh) translateX(80px) rotate(360deg);
      }
    }

    /* Canvas pháo hoa */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }

    /* Khung thẻ chính - Kính mờ cao cấp */
    .card {
      background: rgba(255, 255, 255, 0.88);
      border-radius: 28px;
      padding: 32px 24px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 
        0 18px 45px rgba(233, 30, 99, 0.16),
        0 0 0 1px rgba(255, 255, 255, 0.7) inset;
      border: 1.5px solid rgba(255, 204, 213, 0.8);
      position: relative;
      z-index: 10;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .badge {
      display: inline-block;
      background: #ffe3ea;
      color: #e91e63;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 25px;
      color: #ad1457;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .sub-title {
      font-size: 13.5px;
      color: #666;
      margin-bottom: 18px;
    }

    /* Ô nhập tên người nhận */
    .input-box {
      margin-bottom: 16px;
      text-align: left;
    }
    .input-box label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #ad1457;
      margin-bottom: 6px;
      padding-left: 4px;
    }
    .recipient-input {
      width: 100%;
      padding: 10px 18px;
      font-size: 15px;
      border: 1.8px solid #f8bbd0;
      border-radius: 50px;
      outline: none;
      background: rgba(255, 250, 251, 0.95);
      color: #333;
      font-weight: 600;
      transition: all 0.25s;
    }
    .recipient-input:focus {
      border-color: #e91e63;
      background: #ffffff;
      box-shadow: 0 0 12px rgba(233, 30, 99, 0.22);
    }

    /* Hộp quà tương tác */
    .gift-wrap {
      margin: 6px 0 14px 0;
    }
    .gift-icon {
      font-size: 64px;
      display: inline-block;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 8px 14px rgba(233, 30, 99, 0.25));
    }
    .gift-icon:hover {
      transform: scale(1.12);
    }
    .gift-icon:active {
      transform: scale(0.95);
    }
    .shake {
      animation: shake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

      10%, 90% { transform: translate3d(-2px, 0, 0) rotate(-4deg); }
      20%, 80% { transform: translate3d(3px,
