<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10</title>
  
  <!-- Các bộ font nghệ thuật tiếng Việt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,500;0,700;1,500&family=Caveat:wght@600;700&family=Comfortaa:wght@600;700&family=Dancing+Script:wght@600;700&family=Pacifico&family=Playfair+Display:ital,wght@0,600;1,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Quicksand', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #fff0f5 0%, #ffd8e4 55%, #febfd2 100%);
      padding: 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Hiệu ứng cực quang Pastel (Aurora Glow) */
    .aurora-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .aurora-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
      animation: floatAurora 18s ease-in-out infinite alternate;
    }
    .blob-1 { width: 450px; height: 450px; background: #ff80ab; top: -100px; left: -100px; }
    .blob-2 { width: 500px; height: 500px; background: #ffd54f; bottom: -120px; right: -120px; animation-duration: 22s; }
    .blob-3 { width: 380px; height: 380px; background: #ff4081; bottom: 20%; left: 10%; animation-duration: 16s; }

    @keyframes floatAurora {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.15); }
    }

    /* Bụi kim tuyến nền */
    .sparkle-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      background-image: 
        radial-gradient(2px 2px at 15% 20%, #fff, transparent),
        radial-gradient(3px 3px at 85% 25%, #ffeb3b, transparent),
        radial-gradient(2.5px 2.5px at 20% 80%, #ffd54f, transparent),
        radial-gradient(3px 3px at 80% 85%, #fff, transparent),
        radial-gradient(2px 2px at 50% 15%, #ff80ab, transparent),
        radial-gradient(4px 4px at 50% 90%, #ffe082, transparent);
      background-size: 350px 350px;
      opacity: 0.75;
      animation: sparkleAnim 6s ease-in-out infinite alternate;
    }

    @keyframes sparkleAnim {
      0% { opacity: 0.45; transform: scale(0.98); }
      100% { opacity: 0.85; transform: scale(1.02); }
    }

    /* Viền hoa quanh 4 góc với hiệu ứng đung đưa */
    .flower-frame {
      position: fixed;
      pointer-events: none;
      z-index: 2;
      opacity: 0.95;
      filter: drop-shadow(0 6px 14px rgba(233, 30, 99, 0.2));
      animation: swayFlower 6s ease-in-out infinite alternate;
    }

    @keyframes swayFlower {
      0% { transform: rotate(0deg) scale(1); }
      100% { transform: rotate(2deg) scale(1.03); }
    }

    .flower-tl {
      top: -20px;
      left: -20px;
      width: clamp(220px, 30vw, 380px);
      transform-origin: top left;
    }

    .flower-br {
      bottom: -20px;
      right: -20px;
      width: clamp(240px, 32vw, 400px);
      transform: rotate(180deg);
      transform-origin: bottom right;
    }

    .flower-tr {
      top: -15px;
      right: -15px;
      width: clamp(170px, 22vw, 280px);
      transform: scaleX(-1);
    }

    .flower-bl {
      bottom: -15px;
      left: -15px;
      width: clamp(170px, 22vw, 280px);
      transform: scaleY(-1);
    }

    /* Bướm lượn bay quanh các bông hoa */
    .butterfly {
      position: fixed;
      font-size: 24px;
      pointer-events: none;
      z-index: 3;
      user-select: none;
      animation: flyAround 14s ease-in-out infinite;
    }
    @keyframes flyAround {
      0% { transform: translate(10vw, 85vh) rotate(15deg) scale(0.8); }
      25% { transform: translate(25vw, 40vh) rotate(-10deg) scale(1); }
      50% { transform: translate(80vw, 20vh) rotate(25deg) scale(0.9); }
      75% { transform: translate(70vw, 75vh) rotate(-20deg) scale(1.1); }
      100% { transform: translate(10vw, 85vh) rotate(15deg) scale(0.8); }
    }

    /* Nút bật tắt nhạc góc phải */
    .music-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.85);
      border: 1.5px solid #ffccd5;
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      color: #e91e63;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 4px 12px rgba(233, 30, 99, 0.15);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s;
    }
    .music-btn:hover {
      transform: scale(1.05);
      background: #ffffff;
    }

    /* Hiệu ứng hoa nở khi click */
    .click-flower {
      position: fixed;
      pointer-events: none;
      user-select: none;
      z-index: 9999;
      animation: popFlower 1s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popFlower {
      0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.3) rotate(45deg); opacity: 0.9; }
      100% { transform: translate(-50%, -80px) scale(0.8) rotate(90deg); opacity: 0; }
    }

    /* Cánh hoa rơi tự nhiên */
    .petal {
      position: fixed;
      top: -25px;
      pointer-events: none;
      user-select: none;
      z-index: 3;
      animation: fall linear forwards;
    }
    @keyframes fall {
      to {
        transform: translateY(105vh) translateX(80px) rotate(360deg);
      }
    }

    /* Canvas pháo hoa */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 998;
    }

    /* Khung thẻ kính mờ (Glassmorphism) */
    .card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      padding: 32px 24px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 
        0 18px 45px rgba(233, 30, 99, 0.16),
        0 0 0 1px rgba(255, 255, 255, 0.7) inset;
      border: 1.5px solid rgba(255, 204, 213, 0.8);
      position: relative;
      z-index: 10;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .badge {
      display: inline-block;
      background: #ffe3ea;
      color: #e91e63;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 25px;
      color: #ad1457;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .sub-title {
      font-size: 13.5px;
      color: #666;
      margin-bottom: 18px;
    }

    .input-box {
      margin-bottom: 16px;
      text-align: left;
    }
    .input-box label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13.5px;
      font-weight: 700;
      color: #ad1457;
      margin-bottom: 6px;
      padding-left: 6px;
    }
    .heart-sub {
      color: #e91e63;
      font-size: 15px;
    }
    .recipient-input {
      width: 100%;
      padding: 10px 18px;
      font-size: 15px;
      border: 1.8px solid #f8bbd0;
      border-radius: 50px;
      outline: none;
      background: rgba(255, 250, 251, 0.95);
      color: #333;
      font-weight: 600;
      transition: all 0.25s;
    }
    .recipient-input:focus {
      border-color: #e91e63;
      background: #ffffff;
      box-shadow: 0 0 12px rgba(233, 30, 99, 0.22);
    }

    /* Hộp quà tương tác */
    .gift-wrap {
      margin: 6px 0 14px 0;
    }
    .gift-icon {
      font-size: 64px;
      display: inline-block;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 8px 14px rgba(233, 30, 99, 0.25));
    }
    .gift-icon:hover {
      transform: scale(1.12);
    }
    .gift-icon:active {
      transform: scale(0.95);
    }
    .shake {
      animation: shake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0) rotate(-4deg); }
      20%, 80% { transform: translate3d(3px, 0, 0) rotate(4deg); }
      30%, 50%, 70% { transform: translate3d(-5px, 0, 0) rotate(-6deg); }
      40%, 60% { transform: translate3d(5px, 0, 0) rotate(6deg); }
    }

    /* Khung hiển thị lời chúc */
    .message-box {
      background: rgba(255, 248, 249, 0.92);
      border: 1.5px dashed #f48fb1;
      border-radius: 18px;
      padding: 22px 18px 28px 18px;
      min-height: 145px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
      position: relative;
    }
    .recipient-tag {
      display: inline-block;
      font-size: 12.5px;
      font-weight: 700;
      color: #c2185b;
      background: #fce4ec;
      padding: 4px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    
    .wish-text {
      color: #222;
      font-size: 17px;
      line-height: 1.6;
      transition: opacity 0.2s ease, transform 0.2s ease;
      font-family: 'Quicksand', sans-serif;
    }

    /* Món quà kèm theo */
    .bonus-gift {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #d81b60;
      background: #fff;
      border: 1px solid #ffd1dc;
      padding: 3px 12px;
      border-radius: 20px;
      display: none;
    }

    .font-badge {
      position: absolute;
      bottom: 6px;
      right: 12px;
      font-size: 10.5px;
      color: #b0bec5;
      font-weight: 600;
    }

    /* Nút bấm hành động */
    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-draw {
      background: linear-gradient(45deg, #ff4081, #e91e63);
      color: #fff;
      box-shadow: 0 5px 16px rgba(233, 30, 99, 0.35);
      flex: 1.3;
      justify-content: center;
    }
    .btn-draw:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(233, 30, 99, 0.45);
    }
    .btn-copy {
      background: #fce4ec;
      color: #ad1457;
      border: 1px solid #f8bbd0;
      flex: 1;
      justify-content: center;
    }
    .btn-copy:hover {
      background: #f8bbd0;
    }
    .btn-share {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
      width: 100%;
      justify-content: center;
      margin-top: 2px;
    }
    .btn-share:hover {
      background: #c8e6c9;
    }

    .toast {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12.5px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
      z-index: 100;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Cực quang mềm mại và bụi sao -->
  <div class="aurora-container">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
    <div class="aurora-blob blob-3"></div>
  </div>
  <div class="sparkle-bg"></div>

  <!-- Bướm dập dìu quanh màn hình -->
  <div class="butterfly">🦋</div>

  <!-- Nút nhạc nền du dương -->
  <button id="musicToggle" class="music-btn" onclick="toggleMusic()">
    <span id="musicIcon">🎵</span> <span id="musicText">Bật Nhạc</span>
  </button>

  <!-- SVG cụm hoa 4 góc màn hình -->
  <svg class="flower-frame flower-tl" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M40 120 C10 80, 50 10, 100 30 C70 70, 80 110, 40 120 Z" fill="#81c784" opacity="0.85"/>
    <path d="M120 40 C80 10, 10 50, 30 100 C70 70, 110 80, 120 40 Z" fill="#66bb6a" opacity="0.9"/>
    <circle cx="85" cy="85" r="65" fill="#f48fb1" opacity="0.6"/>
    <circle cx="85" cy="85" r="50" fill="#f06292" opacity="0.8"/>
    <circle cx="85" cy="85" r="35" fill="#e91e63"/>
    <circle cx="85" cy="85" r="18" fill="#c2185b"/>
    <path d="M170 35 C150 5, 2
