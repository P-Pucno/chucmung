
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10</title>
  
  <!-- Các bộ font nghệ thuật tiếng Việt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,500;0,700;1,500&family=Caveat:wght@600;700&family=Comfortaa:wght@600;700&family=Dancing+Script:wght@600;700&family=Pacifico&family=Playfair+Display:ital,wght@0,600;1,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Quicksand', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #fff0f5 0%, #ffd8e4 55%, #febfd2 100%);
      padding: 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Hiệu ứng cực quang Pastel (Aurora Glow) */
    .aurora-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .aurora-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
      animation: floatAurora 18s ease-in-out infinite alternate;
    }
    .blob-1 { width: 450px; height: 450px; background: #ff80ab; top: -100px; left: -100px; }
    .blob-2 { width: 500px; height: 500px; background: #ffd54f; bottom: -120px; right: -120px; animation-duration: 22s; }
    .blob-3 { width: 380px; height: 380px; background: #ff4081; bottom: 20%; left: 10%; animation-duration: 16s; }

    @keyframes floatAurora {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.15); }
    }

    /* Bụi kim tuyến nền */
    .sparkle-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      background-image: 
        radial-gradient(2px 2px at 15% 20%, #fff, transparent),
        radial-gradient(3px 3px at 85% 25%, #ffeb3b, transparent),
        radial-gradient(2.5px 2.5px at 20% 80%, #ffd54f, transparent),
        radial-gradient(3px 3px at 80% 85%, #fff, transparent),
        radial-gradient(2px 2px at 50% 15%, #ff80ab, transparent),
        radial-gradient(4px 4px at 50% 90%, #ffe082, transparent);
      background-size: 350px 350px;
      opacity: 0.75;
      animation: sparkleAnim 6s ease-in-out infinite alternate;
    }

    @keyframes sparkleAnim {
      0% { opacity: 0.45; transform: scale(0.98); }
      100% { opacity: 0.85; transform: scale(1.02); }
    }

    /* Viền hoa quanh 4 góc với hiệu ứng đung đưa */
    .flower-frame {
      position: fixed;
      pointer-events: none;
      z-index: 2;
      opacity: 0.95;
      filter: drop-shadow(0 6px 14px rgba(233, 30, 99, 0.2));
      animation: swayFlower 6s ease-in-out infinite alternate;
    }

    @keyframes swayFlower {
      0% { transform: rotate(0deg) scale(1); }
      100% { transform: rotate(2deg) scale(1.03); }
    }

    .flower-tl {
      top: -20px;
      left: -20px;
      width: clamp(220px, 30vw, 380px);
      transform-origin: top left;
    }

    .flower-br {
      bottom: -20px;
      right: -20px;
      width: clamp(240px, 32vw, 400px);
      transform: rotate(180deg);
      transform-origin: bottom right;
    }

    .flower-tr {
      top: -15px;
      right: -15px;
      width: clamp(170px, 22vw, 280px);
      transform: scaleX(-1);
    }

    .flower-bl {
      bottom: -15px;
      left: -15px;
      width: clamp(170px, 22vw, 280px);
      transform: scaleY(-1);
    }

    /* Bướm lượn bay quanh các bông hoa */
    .butterfly {
      position: fixed;
      font-size: 24px;
      pointer-events: none;
      z-index: 3;
      user-select: none;
      animation: flyAround 14s ease-in-out infinite;
    }
    @keyframes flyAround {
      0% { transform: translate(10vw, 85vh) rotate(15deg) scale(0.8); }
      25% { transform: translate(25vw, 40vh) rotate(-10deg) scale(1); }
      50% { transform: translate(80vw, 20vh) rotate(25deg) scale(0.9); }
      75% { transform: translate(70vw, 75vh) rotate(-20deg) scale(1.1); }
      100% { transform: translate(10vw, 85vh) rotate(15deg) scale(0.8); }
    }

    /* Nút bật tắt nhạc góc phải */
    .music-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.85);
      border: 1.5px solid #ffccd5;
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      color: #e91e63;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 4px 12px rgba(233, 30, 99, 0.15);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s;
    }
    .music-btn:hover {
      transform: scale(1.05);
      background: #ffffff;
    }

    /* Hiệu ứng hoa nở khi click */
    .click-flower {
      position: fixed;
      pointer-events: none;
      user-select: none;
      z-index: 9999;
      animation: popFlower 1s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popFlower {
      0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.3) rotate(45deg); opacity: 0.9; }
      100% { transform: translate(-50%, -80px) scale(0.8) rotate(90deg); opacity: 0; }
    }

    /* Cánh hoa rơi tự nhiên */
    .petal {
      position: fixed;
      top: -25px;
      pointer-events: none;
      user-select: none;
      z-index: 3;
      animation: fall linear forwards;
    }
    @keyframes fall {
      to {
        transform: translateY(105vh) translateX(80px) rotate(360deg);
      }
    }

    /* Canvas pháo hoa */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 998;
    }

    /* Khung thẻ kính mờ (Glassmorphism) */
    .card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      padding: 32px 24px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 
        0 18px 45px rgba(233, 30, 99, 0.16),
        0 0 0 1px rgba(255, 255, 255, 0.7) inset;
      border: 1.5px solid rgba(255, 204, 213, 0.8);
      position: relative;
      z-index: 10;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .badge {
      display: inline-block;
      background: #ffe3ea;
      color: #e91e63;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 25px;
      color: #ad1457;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .sub-title {
      font-size: 13.5px;
      color: #666;
      margin-bottom: 18px;
    }

    .input-box {
      margin-bottom: 16px;
      text-align: left;
    }
    .input-box label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13.5px;
      font-weight: 700;
      color: #ad1457;
      margin-bottom: 6px;
      padding-left: 6px;
    }
    .heart-sub {
      color: #e91e63;
      font-size: 15px;
    }
    .recipient-input {
      width: 100%;
      padding: 10px 18px;
      font-size: 15px;
      border: 1.8px solid #f8bbd0;
      border-radius: 50px;
      outline: none;
      background: rgba(255, 250, 251, 0.95);
      color: #333;
      font-weight: 600;
      transition: all 0.25s;
    }
    .recipient-input:focus {
      border-color: #e91e63;
      background: #ffffff;
      box-shadow: 0 0 12px rgba(233, 30, 99, 0.22);
    }

    /* Hộp quà tương tác */
    .gift-wrap {
      margin: 6px 0 14px 0;
    }
    .gift-icon {
      font-size: 64px;
      display: inline-block;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 8px 14px rgba(233, 30, 99, 0.25));
    }
    .gift-icon:hover {
      transform: scale(1.12);
    }
    .gift-icon:active {
      transform: scale(0.95);
    }
    .shake {
      animation: shake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0) rotate(-4deg); }
      20%, 80% { transform: translate3d(3px, 0, 0) rotate(4deg); }
      30%, 50%, 70% { transform: translate3d(-5px, 0, 0) rotate(-6deg); }
      40%, 60% { transform: translate3d(5px, 0, 0) rotate(6deg); }
    }

    /* Khung hiển thị lời chúc */
    .message-box {
      background: rgba(255, 248, 249, 0.92);
      border: 1.5px dashed #f48fb1;
      border-radius: 18px;
      padding: 22px 18px 28px 18px;
      min-height: 145px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
      position: relative;
    }
    .recipient-tag {
      display: inline-block;
      font-size: 12.5px;
      font-weight: 700;
      color: #c2185b;
      background: #fce4ec;
      padding: 4px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    
    .wish-text {
      color: #222;
      font-size: 17px;
      line-height: 1.6;
      transition: opacity 0.2s ease, transform 0.2s ease;
      font-family: 'Quicksand', sans-serif;
    }

    /* Món quà kèm theo */
    .bonus-gift {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #d81b60;
      background: #fff;
      border: 1px solid #ffd1dc;
      padding: 3px 12px;
      border-radius: 20px;
      display: none;
    }

    .font-badge {
      position: absolute;
      bottom: 6px;
      right: 12px;
      font-size: 10.5px;
      color: #b0bec5;
      font-weight: 600;
    }

    /* Nút bấm hành động */
    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-draw {
      background: linear-gradient(45deg, #ff4081, #e91e63);
      color: #fff;
      box-shadow: 0 5px 16px rgba(233, 30, 99, 0.35);
      flex: 1.3;
      justify-content: center;
    }
    .btn-draw:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(233, 30, 99, 0.45);
    }
    .btn-copy {
      background: #fce4ec;
      color: #ad1457;
      border: 1px solid #f8bbd0;
      flex: 1;
      justify-content: center;
    }
    .btn-copy:hover {
      background: #f8bbd0;
    }
    .btn-share {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
      width: 100%;
      justify-content: center;
      margin-top: 2px;
    }
    .btn-share:hover {
      background: #c8e6c9;
    }

    .toast {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12.5px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
      z-index: 100;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Cực quang mềm mại và bụi sao -->
  <div class="aurora-container">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
    <div class="aurora-blob blob-3"></div>
  </div>
  <div class="sparkle-bg"></div>

  <!-- Bướm dập dìu quanh màn hình -->
  <div class="butterfly">🦋</div>

  <!-- Nút nhạc nền du dương -->
  <button id="musicToggle" class="music-btn" onclick="toggleMusic()">
    <span id="musicIcon">🎵</span> <span id="musicText">Bật Nhạc</span>
  </button>

  <!-- SVG cụm hoa 4 góc màn hình -->
  <svg class="flower-frame flower-tl" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M40 120 C10 80, 50 10, 100 30 C70 70, 80 110, 40 120 Z" fill="#81c784" opacity="0.85"/>
    <path d="M120 40 C80 10, 10 50, 30 100 C70 70, 110 80, 120 40 Z" fill="#66bb6a" opacity="0.9"/>
    <circle cx="85" cy="85" r="65" fill="#f48fb1" opacity="0.6"/>
    <circle cx="85" cy="85" r="50" fill="#f06292" opacity="0.8"/>
    <circle cx="85" cy="85" r="35" fill="#e91e63"/>
    <circle cx="85" cy="85" r="18" fill="#c2185b"/>
    <path d="M170 35 C150 5, 200 5, 180 35 C210 20, 200 65, 175 70 C150 65, 140 20, 170 35 Z" fill="#e53935" opacity="0.9"/>
    <path d="M35 170 C5 150, 5 200, 35 180 C20 210, 65 200, 70 175 C65 150, 20 140, 35 170 Z" fill="#ff4081" opacity="0.85"/>
    <circle cx="155" cy="115" r="14" fill="#ff80ab"/>
    <circle cx="115" cy="155" r="14" fill="#ff80ab"/>
  </svg>

  <svg class="flower-frame flower-br" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M40 120 C10 80, 50 10, 100 30 C70 70, 80 110, 40 120 Z" fill="#81c784" opacity="0.85"/>
    <path d="M120 40 C80 10, 10 50, 30 100 C70 70, 110 80, 120 40 Z" fill="#66bb6a" opacity="0.9"/>
    <circle cx="85" cy="85" r="70" fill="#f48fb1" opacity="0.6"/>
    <circle cx="85" cy="85" r="52" fill="#f06292" opacity="0.8"/>
    <circle cx="85" cy="85" r="36" fill="#e91e63"/>
    <circle cx="85" cy="85" r="18" fill="#ad1457"/>
    <path d="M175 40 C155 10, 205 10, 185 40 C215 25, 205 70, 180 75 C155 70, 145 25, 175 40 Z" fill="#d81b60" opacity="0.9"/>
    <circle cx="160" cy="120" r="16" fill="#ff4081"/>
  </svg>

  <svg class="flower-frame flower-tr" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M30 90 C10 60, 40 10, 80 20 C50 50, 60 80, 30 90 Z" fill="#81c784" opacity="0.8"/>
    <circle cx="65" cy="65" r="45" fill="#f8bbd0" opacity="0.7"/>
    <circle cx="65" cy="65" r="32" fill="#ec407a" opacity="0.85"/>
    <circle cx="65" cy="65" r="16" fill="#c2185b"/>
  </svg>

  <svg class="flower-frame flower-bl" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M30 90 C10 60, 40 10, 80 20 C50 50, 60 80, 30 90 Z" fill="#a5d6a7" opacity="0.8"/>
    <circle cx="65" cy="65" r="45" fill="#f8bbd0" opacity="0.7"/>
    <circle cx="65" cy="65" r="32" fill="#ec407a" opacity="0.85"/>
    <circle cx="65" cy="65" r="16" fill="#d81b60"/>
  </svg>

  <canvas id="confettiCanvas"></canvas>

  <div class="card">
    <div id="toast" class="toast">✨ Đã sao chép!</div>
    <span class="badge">✦ 20/10 Yêu Thương ✦</span>
    <h1>Hộp Quà Lời Chúc</h1>
    <p class="sub-title">Nhập tên của bạn để mở những điều bất ngờ ngọt ngào nhất!</p>

    <!-- Ô nhập tên -->
    <div class="input-box">
      <label for="recipientInput">
        Tên của bạn <span class="heart-sub">&lt;3</span>
      </label>
      <input 
        type="text" 
        id="recipientInput" 
        class="recipient-input" 
        placeholder="Nhập tên đáng yêu của bạn vào đây..." 
        value="Bạn" 
        oninput="updateRecipient()" 
        autocomplete="off"
      />
    </div>

    <div class="gift-wrap">
      <span id="gift" class="gift-icon" onclick="drawWish()">🎁</span>
    </div>

    <div class="message-box">
      <span id="recipientTag" class="recipient-tag">💌 Dành riêng cho: Bạn</span>
      <p id="wish" class="wish-text">Nhấn nút bên dưới để rút lời chúc ngẫu nhiên dành riêng cho bạn nhé!</p>
      <span id="bonusGift" class="bonus-gift"></span>
      <span id="fontBadge" class="font-badge"></span>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-draw" onclick="drawWish()">🎲 Rút Quẻ Ngẫu Nhiên</button>
      <button type="button" class="btn btn-copy" onclick="copyWish()">📋 Sao Chép</button>
      <button type="button" class="btn btn-share" onclick="sharePersonalLink()">🔗 Tạo Link Gửi Cho Người Ấy</button>
    </div>
  </div>

  <script>
    const fontStyles = [
      { name: "Dancing Script", family: "'Dancing Script', cursive", size: "20px", weight: "700" },
      { name: "Pacifico", family: "'Pacifico', cursive", size: "17px", weight: "400" },
      { name: "Playfair Display", family: "'Playfair Display', serif", size: "17px", weight: "600", style: "italic" },
      { name: "Caveat", family: "'Caveat', cursive", size: "22px", weight: "700" },
      { name: "Comfortaa", family: "'Comfortaa', cursive", size: "15.5px", weight: "700" },
      { name: "Be Vietnam Pro", family: "'Be Vietnam Pro', sans-serif", size: "15.5px", weight: "600" }
    ];

    const bonusGifts = [
      "🎁 Món quà kèm: 1 ngày được cưng chiều vô điều kiện!",
      "☕ Món quà kèm: 1 ly trà sữa full topping ngọt ngào!",
      "💸 Món quà kèm: Tài khoản ting ting liên hồi cả tuần!",
      "✨ Món quà kèm: 100 điều may mắn đang trên đường tới!",
      "🍕 Món quà kèm: 1 bữa ăn ngon miệng thả ga không lo béo!",
      "🌸 Món quà kèm: Nhan sắc thăng hạng, vạn người mê đắm!"
    ];

    const wishList = [
      "Nhân ngày 20/10, chúc {name} luôn rạng rỡ như ánh ban mai, ngập tràn niềm vui và nhận được thật nhiều tình cảm ấm áp! 🌸",
      "Chúc {name} không chỉ riêng ngày 20/10 mà cả 365 ngày trong năm đều được yêu thương, chở che và bình an trong từng khoảnh khắc.",
      "Gửi tới {name} ngàn đóa hồng và những lời chúc tốt đẹp nhất: Mong {name} luôn được nâng niu, trân trọng mỗi ngày! 💐",
      "Chúc {name} một đời bình an, sớm ngắm hoa nở, chiều đón hoàng hôn, bên cạnh luôn có người thấu hiểu và cưng chiều. 🌷",
      "Thế giới này nhờ có sự dịu dàng của {name} mà trở nên ấm áp hơn rất nhiều. Chúc mừng ngày Phụ nữ Việt Nam 20/10! ✨",
      "Mong cho những mong ước nhỏ bé của {name} đều trở thành hiện thực, mỗi ngày thức dậy đều là một ngày ngập tràn niềm vui! 💖",
      "Chúc {name} luôn giữ được ánh mắt long lanh và nụ cười ngọt ngào như những ngày đầu tiên. Bạn xứng đáng với tất cả sự nâng niu trên đời! 🎀",
      "Chúc {name} một ngày 20/10 trọn vẹn: Tiền vào ào ào, việc nhẹ lương cao, ăn hoài không béo và lúc nào cũng xinh đẹp! 🥳",
      "Chúc {name} hôm nay: Quà ngập nhà, hoa ngập phòng, điện thoại ting ting tiền về liên tục và người yêu ngoan như cún! 💸",
      "Nhiệm vụ duy nhất của {name} hôm nay là nghỉ ngơi, thật xinh đẹp và đón nhận những điều ngọt ngào nhất. Việc khó cứ để vũ trụ lo! 👑",
      "Chúc {name} da trắng dáng xinh, ăn uống thả ga không lo mỡ bụng, ví luôn rủng rỉnh và shopping không cần nhìn giá! 🛍️",
      "20/10 chúc {name} nhận được nhiều hoa, nhiều quà, và đặc biệt là nhận được sự yêu thương vô điều kiện từ người ấy nhé! 🎁",
      "Chúc {name} luôn tự tin vào bản thân, gặt hái thêm nhiều thành công rực rỡ và luôn là phiên bản tỏa sáng rực rỡ nhất của chính mình! ⭐",
      "Hãy luôn kiêu hãnh như một đóa hồng, xinh đẹp độc lập và mạnh mẽ bước đi trên con đường {name} đã chọn. Chúc mừng 20/10! 🌹",
      "20 tháng 10 rộn ràng,\nChúc cho {name} mãi dịu dàng đoan trang,\nTiền vô như nước đò ngang,\nHạnh phúc ngập tràn rạng rỡ như hoa! 📜🌸",
      "Hoa hồng có gai nhưng em thì không,\nChúc {name} má đỏ môi hồng,\nĐường tình như ý, đường tiền mênh mông! ✨💖",
      "20/10 chúc {name} cười tươi như hoa nở mùa xuân, mắt biếc long lanh, ví dày cộm và bão giông cuộc đời dừng sau cánh cửa! 🍀",
      "Chúc {name} luôn tràn đầy năng lượng tích cực, công việc thuận buồm xuôi gió, tình duyên như ý và vạn sự hanh thông! 💼",
      "Cảm ơn vì {name} đã xuất hiện và mang đến nguồn năng lượng tươi sáng cho những người xung quanh. Chúc bạn có một ngày 20/10 thật trọn vẹn! 💌",
      "Chúc {name} một đời được yêu thương đúng cách, không phải gồng mình mạnh mẽ, luôn được dịu dàng ôm ấp sau những ngày mỏi mệt! 🕊️"
    ];

    let lastWishIndex = -1;
    let lastFontIndex = -1;
    let currentRawWish = "";

    function getName() {
      const input = document.getElementById('recipientInput');
      const val = input ? input.value.trim() : "";
      return val !== "" ? val : "Bạn";
    }

    function formatText(template, name) {
      return template.split("{name}").join(name);
    }

    function applyRandomFont() {
      const wishElem = document.getElementById('wish');
      const fontBadge = document.getElementById('fontBadge');
      
      let fIndex;
      do {
        fIndex = Math.floor(Math.random() * fontStyles.length);
      } while (fIndex === lastFontIndex && fontStyles.length > 1);

      lastFontIndex = fIndex;
      const font = fontStyles[fIndex];

      wishElem.style.fontFamily = font.family;
      wishElem.style.fontSize = font.size;
      wishElem.style.fontWeight = font.weight;
      wishElem.style.fontStyle = font.style || "normal";
      
      if (fontBadge) {
        fontBadge.innerText = font.name;
      }
    }

    function updateRecipient() {
      const name = getName();
      document.getElementById('recipientTag').innerText = "💌 Dành riêng cho: " + name;
      if (currentRawWish) {
        document.getElementById('wish').innerText = formatText(currentRawWish, name);
      }
    }

    // Kiểm tra tham số ?name= trên URL
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const urlName = params.get('name');
      if (urlName) {
        const input = document.getElementById('recipientInput');
        input.value = decodeURIComponent(urlName);
        updateRecipient();
        setTimeout(drawWish, 500);
      }
    });

    // Hiệu ứng pháo hoa Canvas thuần
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function fireConfetti() {
      const colors = ['#ff4081', '#ff80ab', '#f50057', '#ffd54f', '#ff1744', '#b388ff', '#ffeb3b'];
      for (let i = 0; i < 75; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height * 0.55,
          vx: (Math.random() - 0.5) * 15,
          vy: (Math.random() - 0.85) * 16,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          rot: Math.random() * 360
        });
      }
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.35;
        p.alpha -= 0.012;
        p.rot += 4;

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();

        if (p.alpha <= 0 || p.y > canvas.height) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(animateConfetti);
    }
    animateConfetti();

    // Rút quẻ ngẫu nhiên
    function drawWish() {
      const gift = document.getElementById('gift');
      const wishElem = document.getElementById('wish');
      const bonusElem = document.getElementById('bonusGift');

      gift.classList.remove('shake');
      void gift.offsetWidth;
      gift.classList.add('shake');

      wishElem.style.opacity = '0';
      wishElem.style.transform = 'scale(0.96)';

      setTimeout(() => {
        let index;
        do {
          index = Math.floor(Math.random() * wishList.length);
        } while (index === lastWishIndex && wishList.length > 1);

        lastWishIndex = index;
        currentRawWish = wishList[index];

        const name = getName();
        wishElem.innerText = formatText(currentRawWish, name);
        document.getElementById('recipientTag').innerText = "💌 Dành riêng cho: " + name;
        
        // Quà tặng kèm ngẫu nhiên
        const randomBonus = bonusGifts[Math.floor(Math.random() * bonusGifts.length)];
        bonusElem.innerText = randomBonus;
        bonusElem.style.display = "inline-block";

        applyRandomFont();

        wishElem.style.opacity = '1';
        wishElem.style.transform = 'scale(1)';

        fireConfetti();
      }, 180);
    }

    function copyWish() {
      const text = document.getElementById('wish').innerText;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast("✨ Đã sao chép lời chúc!"));
      } else {
        const temp = document.createElement("textarea");
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        showToast("✨ Đã sao chép lời chúc!");
      }
    }

    // Tạo link cá nhân hóa
    function sharePersonalLink() {
      const name = encodeURIComponent(getName());
      const shareUrl = window.location.origin + window.location.pathname + "?name=" + name;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          showToast("🔗 Đã chép link riêng cho " + getName() + "!");
        });
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    document.getElementById('recipientInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        drawWish();
      }
    });

    // Cánh hoa rơi nền
    function createPetal() {
      const petal = document.createElement('div');
      petal.className = 'petal';
      petal.innerText = ['🌸', '✨', '💐', '🌷', '💖', '❤️'][Math.floor(Math.random() * 6)];
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.fontSize = (Math.random() * 8 + 14) + 'px';
      petal.style.animationDuration = (Math.random() * 4 + 5) + 's';
      petal.style.opacity = Math.random() * 0.7 + 0.3;
      document.body.appendChild(petal);

      setTimeout(() => petal.remove(), 8000);
    }
    for (let i = 0; i < 10; i++) {
      setTimeout(createPetal, Math.random() * 4000);
    }
    setInterval(createPetal, 450);

    // Hiệu ứng nhấp chuột/chạm nở hoa
    document.addEventListener('click', (e) => {
      // Bỏ qua nếu bấm vào nút hoặc ô nhập
      if (['BUTTON', 'INPUT'].includes(e.target.tagName) || e.target.closest('button')) return;

      const f = document.createElement('div');
      f.className = 'click-flower';
      f.innerText = ['🌹', '🌸', '✨', '💖', '🌷'][Math.floor(Math.random() * 5)];
      f.style.left = e.clientX + 'px';
      f.style.top = e.clientY + 'px';
      f.style.fontSize = (Math.random() * 10 + 22) + 'px';
      document.body.appendChild(f);

      setTimeout(() => f.remove(), 1000);
    });

    // Tạo âm thanh Piano qua Web Audio API
    let audioCtx = null;
    let isPlaying = false;
    let timerId = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    const melody = [
      261.63, 329.63, 392.00, 523.25, 392.00, 329.63,
      293.66, 349.23, 440.00, 587.33, 440.00, 349.23,
      329.63, 392.00, 493.88, 659.25, 493.88, 392.00,
      349.23, 440.00, 523.25, 698.46, 523.25, 440.00
    ];
    let noteIdx = 0;

    function playNote() {
      if (!isPlaying || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(melody[noteIdx], audioCtx.currentTime);

      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.85);

      noteIdx = (noteIdx + 1) % melody.length;
      timerId = setTimeout(playNote, 380);
    }

    function toggleMusic() {
      initAudio();
      const icon = document.getElementById('musicIcon');
      const text = document.getElementById('musicText');

      if (!isPlaying) {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        isPlaying = true;
        icon.innerText = '🔊';
        text.innerText = 'Dừng Nhạc';
        playNote();
      } else {
        isPlaying = false;
        clearTimeout(timerId);
        icon.innerText = '🎵';
        text.innerText = 'Bật Nhạc';
      }
    }
  </script>
</body>
